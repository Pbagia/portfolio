          {Array.from({ length: firstDow }).map((_, i) => <div key={"e" + i} />)}

            return (
              <button key={day} disabled={!gs.length} onClick={() => setSel(day)} style={{
                aspectRatio: "1", borderRadius: 10, border: "1px solid " + (isSel ? "var(--amber)" : "var(--line)"),

                display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "flex-start", opacity: past ? .4 : 1, position: "relative",
              }}>
                <span className="mono" style={{ fontSize: 11, fontWeight: isToday ? 700 : 400, color: isToday ? "var(--cyan)" : "var(--text)" }}>{day}</span>

                  <div style={{ display: "flex", gap: 2, marginTop: 3, flexWrap: "wrap", justifyContent: "center" }}>

      <div className="card" style={{ padding: 16 }}>

          <>
            <div className="eyebrow" style={{ color: "var(--amber)", marginBottom: 4 }}>{WD[new Date(2026, 5, sel).getDay()]}, June {sel}</div>

                    <div onClick={() => onTeam(g.home)} style={{ cursor: "pointer" }}><Badge id={g.home} size={36} /></div>

function Shop({ onAdd, shopTeam, setShopTeam }) {
  const [cat, setCat] = useState("All");
  const cats = ["All", "Jersey", "Headwear", "Hoodie", "Tee", "Accessory", "Jacket"];
  const list = MERCH.filter((m) => (cat === "All" || m.cat === cat) && (!shopTeam || m.team === shopTeam));
  const fresh = list.filter((m) => m.status === "new" || m.status === "drop");
  const sales = list.filter((m) => m.status === "sale");
  const rest = list.filter((m) => m.status === "reg");
  return (
    <div className="fade">
      <SectionTitle kicker="Official team gear" title="Merch shop" action={shopTeam ?
        <button className="btn btn-sm" onClick={() => setShopTeam(null)}><X size={13} />{T(shopTeam).abbr}</button> : null} />
      <div className="scrollx" style={{ display: "flex", gap: 8, marginBottom: 18 }}>
        {cats.map((c) => <button key={c} className="btn btn-sm" onClick={() => setCat(c)} style={cat === c ? { background: "var(--amber)", color: "#160a02", borderColor: "var(--amber)" } : {}}>{c}</button>)}
      </div>
      {fresh.length > 0 && <Block title="New & upcoming drops" kicker="Just in" items={fresh} onAdd={onAdd} />}
      {sales.length > 0 && <Block title="On sale" kicker="Markdowns" items={sales} onAdd={onAdd} />}
      {rest.length > 0 && <Block title="More gear" items={rest} onAdd={onAdd} />}
      {list.length === 0 && <div className="card-2" style={{ padding: 26, textAlign: "center", color: "var(--muted)" }}>No items match this filter.</div>}
    </div>
  );
}
function Block({ title, kicker, items, onAdd }) {
  return (
    <section style={{ marginBottom: 26 }}>

      <div style={{ display: "grid", gap: 12, gridTemplateColumns: "repeat(auto-fill,minmax(160px,1fr))" }}>

}

/* ============================== CART DRAWER ============================== */
function Cart({ open, close, cart, setCart, checkout }) {
  const items = cart.map((c) => ({ ...c, m: MERCH.find((x) => x.id === c.id) }));
  const total = items.reduce((s, i) => s + (i.m.sale || i.m.price) * i.qty, 0);
  const setQty = (id, q) => setCart((c) => q <= 0 ? c.filter((x) => x.id !== id) : c.map((x) => x.id === id ? { ...x, qty: q } : x));
  if (!open) return null;
  return (
    <div onClick={close} style={{ position: "absolute", inset: 0, background: "rgba(5,8,18,.6)", zIndex: 60, display: "flex", justifyContent: "flex-end" }}>
      <div onClick={(e) => e.stopPropagation()} className="fade" style={{ width: "100%", background: "var(--panel)", height: "100%", display: "flex", flexDirection: "column" }}>

              <span className="eyebrow">Subtotal</span><span className="display" style={{ fontSize: 22 }}>{money(total)}</span>

            <button className="btn btn-accent" style={{ width: "100%", justifyContent: "center" }} onClick={checkout}>Checkout · {money(total)}</button>

  const SORTS = [["date", "Date"], ["sell", "Sell-through"], ["gross", "Gross"], ["sold", "Sold"], ["cap", "Capacity"]];
  const getv = { date: (e) => e.g.day, sell: (e) => e.fill, gross: (e) => e.gross, sold: (e) => e.sold, cap: (e) => e.cap };
  const filtered = events.filter((e) => status === "All" || e.status === status);

  const toggle = (id) => setSel((s) => s.includes(id) ? s.filter((x) => x !== id) : (s.length >= 3 ? s : [...s, id]));
  const chosen = sel.map((id) => events.find((e) => e.g.id === id)).filter(Boolean);
  const avg = (e) => e.sold > 0 ? Math.round(e.gross / e.sold) : e.g.from;
  const rows = [
    { label: "Date", txt: (e) => `${MO[gDate(e.g).getMonth()]} ${gDate(e.g).getDate()}` },
    { label: "Venue", txt: (e) => e.g.venue || T(e.g.home).venue },
    { label: "Capacity", num: (e) => e.cap, fmt: bnum },
    { label: "Sold", num: (e) => e.sold, fmt: bnum, best: true },
    { label: "Sell-through", pct: (e) => e.fill, best: true },
    { label: "Gross", num: (e) => e.gross, fmt: bmoney, best: true },
    { label: "Avg price", num: (e) => avg(e), fmt: (v) => "$" + v, best: true },
    { label: "Status", status: true },
  ];
  const N = chosen.length;
  const tmpl = `minmax(104px,.9fr) repeat(${N}, minmax(128px,1fr))`;
  return (
    <div onClick={close} style={{ position: "fixed", top: 0, left: 0, right: 0, height: "100vh", background: "rgba(16,28,54,.5)", backdropFilter: "blur(4px)", zIndex: 1000, display: "flex", alignItems: "center", justifyContent: "center", padding: 20 }}>
      <div onClick={(e) => e.stopPropagation()} className="cs-biz card fade" style={{ width: "100%", maxWidth: 720, padding: 22, maxHeight: "92vh", overflowY: "auto", background: "var(--panel)", color: "var(--text)" }}>
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between" }}>
          <div>
            <div className="eyebrow" style={{ color: "var(--cyan)", marginBottom: 6 }}>Analysis</div>
            <h2 className="heading" style={{ fontWeight: 800, fontSize: 20, margin: 0 }}>Compare events</h2>
          </div>
          <button className="btn btn-sm btn-ghost" onClick={close}><X size={15} /></button>
        </div>
        <p style={{ color: "var(--muted)", fontSize: 13, margin: "8px 0 16px" }}>Pick up to three events to compare side by side. The best value in each row is highlighted.</p>

        <div className="scrollx" style={{ display: "flex", gap: 7, marginBottom: 18, paddingBottom: 4 }}>
          {events.map((e) => {
            const on = sel.includes(e.g.id);
            return (
              <button key={e.g.id} onClick={() => toggle(e.g.id)} className="btn btn-sm"
                style={on ? { background: "var(--amber)", color: "#160a02", borderColor: "var(--amber)", padding: "6px 11px", fontSize: 11, whiteSpace: "nowrap" } : { padding: "6px 11px", fontSize: 11, whiteSpace: "nowrap" }}>
                {T(e.g.away).abbr}@{T(e.g.home).abbr} · {MO[gDate(e.g).getMonth()]} {gDate(e.g).getDate()}
              </button>
            );
          })}
        </div>

        {N < 2 ? (
          <div className="card-2" style={{ padding: 28, textAlign: "center", color: "var(--muted)", fontSize: 13 }}>Select at least two events to compare.</div>
        ) : (
          <div className="scrollx">
            <div style={{ minWidth: 110 + N * 150 }}>
              <div style={{ display: "grid", gridTemplateColumns: tmpl, gap: 10, alignItems: "end", paddingBottom: 12, borderBottom: "1px solid var(--line)" }}>
                <span />
                {chosen.map((e) => (
                  <div key={e.g.id}>
                    <div style={{ display: "flex", gap: 5, marginBottom: 7 }}><Badge id={e.g.away} size={24} r={7} /><Badge id={e.g.home} size={24} r={7} /></div>
                    <div className="heading" style={{ fontWeight: 700, fontSize: 13 }}>{T(e.g.away).abbr} at {T(e.g.home).abbr}</div>
                  </div>
                ))}
              </div>
              {rows.map((r) => {
                let best = new Set();
                if (r.best) {
                  const vals = chosen.map((e) => (r.pct ? r.pct(e) : r.num(e)));
                  const mx = Math.max(...vals);
                  vals.forEach((v, i) => { if (v === mx) best.add(i); });
                }
                return (
                  <div key={r.label} style={{ display: "grid", gridTemplateColumns: tmpl, gap: 10, alignItems: "center", padding: "12px 0", borderBottom: "1px solid var(--line)" }}>
                    <span className="eyebrow">{r.label}</span>
                    {chosen.map((e, i) => {
                      const hot = best.has(i);
                      if (r.txt) return <span key={i} className="mono" style={{ fontSize: 12, color: "var(--muted)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{r.txt(e)}</span>;
                      if (r.status) return <span key={i}><StatusPill status={e.status} /></span>;
                      if (r.pct) {
                        const p = Math.round(r.pct(e) * 100);
                        return (
                          <span key={i} style={{ display: "flex", alignItems: "center", gap: 8 }}>
                            <span style={{ flex: 1, height: 6, borderRadius: 5, background: "var(--panel3)", overflow: "hidden", minWidth: 36 }}><span style={{ display: "block", width: p + "%", height: "100%", background: hot ? "var(--amber)" : "var(--cyan)" }} /></span>
                            <span className="mono" style={{ fontSize: 12, fontWeight: hot ? 700 : 400, color: hot ? "var(--amber)" : "var(--text)" }}>{p}%</span>
                          </span>
                        );
                      }
                      return <span key={i} className="mono" style={{ fontSize: 13, fontWeight: hot ? 700 : 400, color: hot ? "var(--amber)" : "var(--text)" }}>{r.fmt(r.num(e))}</span>;
                    })}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

            {filters.map((f) => <button key={f} className="btn btn-sm" onClick={() => setFilt(f)} style={filt === f ? { background: "var(--amber)", color: "#160a02", borderColor: "var(--amber)" } : {}}>{f}</button>)}
          </div>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {list.map((f) => {
            const ch = FB_CHAN[f.channel]; const ChIc = ch.ic; const [bg, c] = SENT[f.s];
            return (
              <div key={f.id} className="card-2" style={{ padding: 15 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 11, marginBottom: 9, flexWrap: "wrap" }}>
                  <div className="display" style={{ width: 34, height: 34, borderRadius: 9, background: "var(--panel3)", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 12, flex: "none" }}>{f.name.split(" ").map((x) => x[0]).join("")}</div>
                  <div>
                    <div className="heading" style={{ fontWeight: 700, fontSize: 13 }}>{f.name}</div>
                    <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 2 }}><Stars n={f.rating} /><span className="mono" style={{ fontSize: 10.5, color: "var(--faint)", display: "inline-flex", alignItems: "center", gap: 3 }}><ChIc size={11} />{ch.l}</span></div>
                  </div>
                  <span className="pill" style={{ background: bg, color: c, marginLeft: "auto" }}>{f.cat}</span>
                  <span className="mono" style={{ fontSize: 11, color: "var(--faint)" }}>{f.when}</span>
                </div>
                <p style={{ margin: "0 0 12px", fontSize: 13.5, lineHeight: 1.5, color: "var(--text)" }}>{f.text}</p>
                <div style={{ display: "flex", gap: 8 }}>
                  <button className="btn btn-sm btn-ghost" onClick={() => flash("Reply drafted")}><MessageSquare size={13} />Respond</button>
                  <button className="btn btn-sm btn-ghost" onClick={() => flash("Marked resolved")}><Check size={13} />Resolve</button>
                </div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function BusinessShell({ onExit }) {
  const [mod, setMod] = useState("sales");
  const [collapsed, setCollapsed] = useState(false);
  const [toast, setToast] = useState(null);
  const [extra, setExtra] = useState([]);
  const [showNew, setShowNew] = useState(false);
  const active = BIZ_MODS.find((m) => m.k === mod);
  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2400); };
  const base = bizEvents();
  const events = [...base, ...extra].sort((a, b) => a.g.day - b.g.day);
  const addEvent = (evs) => { const arr = Array.isArray(evs) ? evs : [evs]; setExtra((x) => [...x, ...arr]); setShowNew(false); flash(arr.length > 1 ? `Series added · ${arr.length} events on sale` : "Event added & put on sale"); };
  return (
    <div style={{ minHeight: "100vh", background: "var(--ink)" }}>
      <header style={{ borderBottom: "1px solid var(--line)", position: "sticky", top: 0, zIndex: 10, background: "rgba(237,241,247,.88)", backdropFilter: "blur(8px)" }}>
        <div style={{ maxWidth: 1320, margin: "0 auto", padding: "13px 20px", display: "flex", alignItems: "center", gap: 12 }}>
          {SHOW_BACK && <a href="case-courtside.html" onClick={backToCase} className="btn btn-sm btn-ghost" style={{ textDecoration: "none", marginRight: 2 }}><ChevronLeft size={15} />Case study</a>}
          <div className="display" style={{ width: 32, height: 32, borderRadius: 9, background: "var(--cyan)", color: "#04201d", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 16 }}>C</div>
          <div className="heading" style={{ fontWeight: 900, fontSize: 16 }}>COURTSIDE <span style={{ color: "var(--muted)", fontWeight: 700 }}>· Business</span></div>
          <div style={{ flex: 1 }} />
          {!EMBED && <button className="btn btn-sm btn-ghost" onClick={onExit}><ArrowRightLeft size={14} />Switch experience</button>}
        </div>
      </header>
      <div className="biz-wrap" style={{ maxWidth: 1320, margin: "0 auto", display: "flex", alignItems: "flex-start" }}>
        <aside className={"biz-nav" + (collapsed ? " collapsed" : "")}>
          <div className="biz-navtop">
            <span className="biz-menulabel eyebrow">Console</span>
            <button className="biz-collapse" onClick={() => setCollapsed((c) => !c)} title={collapsed ? "Expand menu" : "Collapse menu"} aria-label="Toggle menu">
              {collapsed ? <ChevronRight size={16} /> : <ChevronLeft size={16} />}
            </button>
          </div>
          {BIZ_MODS.map((m) => (
            <button key={m.k} type="button" onClick={() => setMod(m.k)} title={m.t}
              className={"biz-navitem" + (mod === m.k ? " active" : "")}>
              <span className="biz-navbar" />
              <m.ic size={18} className="biz-navic" />
              <span className="biz-navlabel">{m.t}</span>
              {!m.live && <span className="pill biz-soon">Soon</span>}
            </button>
          ))}
        </aside>
        <main className="biz-main">
          {active.k === "sales" ? <BizDashboard events={events} base={base} />
            : active.k === "schedule" ? <BizSchedule events={events} openNew={() => setShowNew(true)} />
            : active.k === "feedback" ? <BizFeedback flash={flash} />
            : <ComingSoon mod={active} />}
        </main>
      </div>
      <style>{`
        .biz-nav{width:248px;flex:none;padding:16px 12px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);position:sticky;top:58px;transition:width .18s ease;}
        .biz-nav.collapsed{width:68px;}
        .biz-navtop{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 10px;margin-bottom:6px;border-bottom:1px solid var(--line);}
        .biz-menulabel{color:var(--faint);}
        .biz-collapse{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;transition:.15s;flex:none;}
        .biz-collapse:hover{color:var(--text);border-color:var(--line2);background:var(--panel2);}
        .biz-navitem{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer;font-family:'Archivo';font-weight:700;font-size:13.5px;text-align:left;transition:background .15s,color .15s;}
        .biz-navitem:hover{background:var(--panel2);color:var(--text);}
        .biz-navitem:hover .biz-navic{color:var(--text);}
        .biz-navitem:focus-visible{outline:2px solid var(--amber);outline-offset:2px;}
        .biz-navitem.active{background:var(--panel2);color:var(--text);border-color:var(--line);}
        .biz-navitem.active .biz-navic{color:var(--amber);}
        .biz-navic{flex:none;color:var(--muted);transition:color .15s;}
        .biz-navlabel{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
        .biz-soon{background:var(--panel3);color:var(--muted);font-size:9px;flex:none;}
        .biz-navbar{position:absolute;left:3px;top:50%;transform:translateY(-50%);width:3px;height:0;border-radius:3px;background:var(--amber);transition:height .18s ease,opacity .15s;opacity:0;}
        .biz-navitem:hover .biz-navbar{height:42%;opacity:.5;}
        .biz-navitem.active .biz-navbar{height:62%;opacity:1;}
        .biz-nav.collapsed .biz-navlabel,.biz-nav.collapsed .biz-soon,.biz-nav.collapsed .biz-menulabel{display:none;}
        .biz-nav.collapsed .biz-navitem{justify-content:center;gap:0;padding-left:0;padding-right:0;}
        .biz-nav.collapsed .biz-navtop{justify-content:center;}
        .biz-main{flex:1;min-width:0;padding:26px 22px 60px;}
        .biz-2col{display:grid;grid-template-columns:1fr;gap:16px;}
        .biz-trow{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1.6fr 1.2fr 1.1fr;gap:12px;align-items:center;}
        .biz-thead{padding:0 0 12px;border-bottom:1px solid var(--line);}
        .biz-thead>span{font-family:'Archivo';font-weight:800;text-transform:uppercase;letter-spacing:.12em;font-size:10px;color:var(--muted);}
        .biz-tbody{padding:13px 0;border-bottom:1px solid var(--line);}
        @media(min-width:1000px){.biz-2col{grid-template-columns:1.7fr 1fr;}}
        @media(max-width:820px){
          .biz-wrap{flex-direction:column;}
          .biz-nav,.biz-nav.collapsed{width:100%;flex-direction:row;overflow-x:auto;position:static;border-right:none;border-bottom:1px solid var(--line);padding:10px;gap:6px;scrollbar-width:none;}
          .biz-nav::-webkit-scrollbar{display:none}
          .biz-navtop{display:none;}
          .biz-navitem{width:auto;white-space:nowrap;padding:9px 14px;}
          .biz-navbar{display:none;}
          .biz-nav.collapsed .biz-navlabel,.biz-nav.collapsed .biz-soon{display:inline;}
          .biz-nav.collapsed .biz-navitem{justify-content:flex-start;gap:12px;padding:9px 14px;}
          .biz-main{padding:20px 16px 60px;}
        }
      `}</style>
      {showNew && <NewEventModal close={() => setShowNew(false)} onCreate={addEvent} />}
      {toast && (
        <div className="fade" style={{ position: "fixed", bottom: 24, left: "50%", transform: "translateX(-50%)", zIndex: 80, background: "var(--panel3)", border: "1px solid var(--line2)", borderRadius: 12, padding: "11px 16px", display: "flex", alignItems: "center", gap: 10, boxShadow: "0 12px 40px rgba(0,0,0,.5)" }}>
          <span style={{ width: 20, height: 20, borderRadius: "50%", background: "var(--good)", display: "flex", alignItems: "center", justifyContent: "center", flex: "none" }}><Check size={13} style={{ color: "#04130a" }} /></span>
          <span className="heading" style={{ fontWeight: 700, fontSize: 13 }}>{toast}</span>
        </div>
      )}
    </div>
  );
}
function Megaphone(p) { return (<svg className={p.className} width={p.size || 24} height={p.size || 24} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={p.style}><path d="m3 11 18-5v12L3 14v-3z" /><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6" /></svg>); }

/* ============================== ROOT ============================== */
function App() {
  const [experience, setExperience] = useState(INITIAL_EXP);
  const [view, setView] = useState("home");
  const [teamId, setTeamId] = useState(null);
  const [follow, setFollow] = useState([1, 4, 7, 13]);
  const [cart, setCart] = useState([]);
  const [cartOpen, setCartOpen] = useState(false);
  const [buyGame, setBuyGame] = useState(null);
  const [seatModal, setSeatModal] = useState(null);
  const [shopTeam, setShopTeam] = useState(null);
  const [toast, setToast] = useState(null);
  const [tickets, setTickets] = useState([
    { id: 8841, gameId: 105, sec: "108", row: "F", seat: "12", price: 220, type: "season" },
    { id: 8842, gameId: 104, sec: "121", row: "M", seat: "7", price: 95, type: "single" },
    { id: 8843, gameId: 103, sec: "326", row: "P", seat: "4", price: 145, type: "single" },
  ]);
  const scrollRef = useRef(null);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = 0; }, [view, teamId, experience]);

  const user = { name: "Jordan Rivera", follow };
  const cartCount = cart.reduce((s, c) => s + c.qty, 0);
  const flash = (msg) => { setToast(msg); setTimeout(() => setToast(null), 2600); };
  const go = (v) => { setView(v); setTeamId(null); };
  const openTeam = (id) => { setTeamId(id); setView("teams"); };
  const toggleFollow = (id) => setFollow((f) => f.includes(id) ? f.filter((x) => x !== id) : [...f, id]);
  const addToCart = (m) => { setCart((c) => { const e = c.find((x) => x.id === m.id); return e ? c.map((x) => x.id === m.id ? { ...x, qty: x.qty + 1 } : x) : [...c, { id: m.id, qty: 1 }]; }); flash(`Added ${m.name}`); };
  const confirmBuy = (game, sec, qty) => {
    const base = { id: 9000 + Math.floor(Math.random() * 999), gameId: game.id, sec: String(100 + Math.floor(Math.random() * 200)), row: "ABCDEFGH"[Math.floor(Math.random() * 8)], seat: String(1 + Math.floor(Math.random() * 20)), price: sec.price, type: "single" };
    setTickets((t) => [...t, base]); setBuyGame(null);
    flash(`${qty} ticket${qty > 1 ? "s" : ""} confirmed · ${sec.name}`);
  };
  const checkout = () => { setCartOpen(false); flash(`Order placed — ${cartCount} item${cartCount > 1 ? "s" : ""}`); setCart([]); };

  if (!experience) return <div className="cs-root"><Style /><Launcher onPick={setExperience} /></div>;
  if (experience === "business") return <div className="cs-root cs-biz"><Style /><BusinessShell onExit={() => setExperience(null)} /></div>;

  const NAV = [
    { k: "home", label: "Home", ic: HomeIc },
    { k: "teams", label: "Teams", ic: Users },
    { k: "tickets", label: "Tickets", ic: Ticket },
    { k: "shop", label: "Shop", ic: ShoppingBag },
    { k: "profile", label: "Profile", ic: User },
  ];
  let body;
  if (view === "home") body = <Home user={user} tickets={tickets} onTickets={setBuyGame} onTeam={openTeam} onSwitch={(tk) => setSeatModal({ tk, mode: "switch" })} onResale={(tk) => setSeatModal({ tk, mode: "resale" })} go={go} />;
  else if (view === "teams") body = teamId ? <TeamDetail id={teamId} back={() => setTeamId(null)} follow={follow} onFollow={toggleFollow} onTickets={setBuyGame} onTeam={openTeam} go={go} setShopTeam={setShopTeam} /> : <Teams onTeam={openTeam} follow={follow} onFollow={toggleFollow} />;
  else if (view === "tickets") body = <Tickets onTickets={setBuyGame} onTeam={openTeam} />;
  else if (view === "shop") body = <Shop onAdd={addToCart} shopTeam={shopTeam} setShopTeam={setShopTeam} />;
  else if (view === "profile") body = <Profile user={user} tickets={tickets} follow={follow} onFollow={toggleFollow} onTeam={openTeam} onSwitch={(tk) => setSeatModal({ tk, mode: "switch" })} onResale={(tk) => setSeatModal({ tk, mode: "resale" })} go={go} onExit={() => setExperience(null)} />;

  const now = new Date(); const time = `${now.getHours() % 12 || 12}:${String(now.getMinutes()).padStart(2, "0")}`;

  return (
    <div className="cs-root">
      <Style />
      <div className="stage">
        {!EMBED && <button className="btn btn-sm btn-ghost switch-pill" onClick={() => setExperience(null)}><ArrowRightLeft size={13} />Switch</button>}
        {SHOW_BACK && <a href="case-courtside.html" onClick={backToCase} className="btn btn-sm btn-ghost cs-backfloat"><ChevronLeft size={15} />Case study</a>}
        <div className="phone">
          <div className="phone-screen">
            {/* status bar */}
            <div className="statusbar">
              <span className="mono" style={{ fontSize: 13, fontWeight: 700 }}>{time}</span>
              <span style={{ display: "flex", alignItems: "center", gap: 6, color: "var(--text)" }}>
                <Radio size={13} /><Wifi size={14} /><BatteryFull size={18} />
              </span>
            </div>
            {/* app bar */}
            <div className="appbar">
              <div style={{ display: "flex", alignItems: "center", gap: 9, cursor: "pointer", flex: 1 }} onClick={() => go("home")}>
                <div className="display" style={{ width: 30, height: 30, borderRadius: 8, background: "var(--amber)", color: "#160a02", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15 }}>C</div>
                <div className="heading" style={{ fontWeight: 900, fontSize: 16, letterSpacing: "-.01em" }}>COURTSIDE</div>
              </div>
              <button className="btn btn-sm btn-ghost" style={{ padding: 8, position: "relative" }} aria-label="Notifications">
                <Bell size={16} /><span style={{ position: "absolute", top: 5, right: 5, width: 6, height: 6, borderRadius: "50%", background: "var(--amber)" }} />
              </button>
              <button className="btn btn-sm btn-ghost" style={{ padding: 8, position: "relative" }} onClick={() => setCartOpen(true)} aria-label="Cart">
                <ShoppingCart size={16} />
                {cartCount > 0 && <span className="mono" style={{ position: "absolute", top: -6, right: -6, minWidth: 17, height: 17, padding: "0 4px", borderRadius: 9, background: "var(--amber)", color: "#160a02", fontSize: 10, fontWeight: 700, display: "flex", alignItems: "center", justifyContent: "center" }}>{cartCount}</span>}
              </button>
            </div>
            {/* ticker */}
            <div className="ticker-mask" style={{ borderTop: "1px solid var(--line)", borderBottom: "1px solid var(--line)", background: "#0a0e1c", flex: "none" }}>
              <div className="ticker-track">
                {[0, 1].map((dup) => (
                  <div key={dup} style={{ display: "flex" }} aria-hidden={dup === 1}>
                    {LIVE.map((s, i) => {
                      const a = TA(s.a), h = TA(s.h);
                      return (
                        <div key={dup + "-" + i} style={{ display: "flex", alignItems: "center", gap: 7, padding: "7px 16px", borderRight: "1px solid var(--line)" }}>
                          {s.live ? <span className="livedot" /> : <span className="mono" style={{ fontSize: 9, color: "var(--faint)" }}>FT</span>}
                          <span className="display" style={{ fontSize: 12, color: a.c2 }}>{s.a}</span>
                          <span className="mono" style={{ fontWeight: 700, fontSize: 12, color: s.as > s.hs ? "var(--text)" : "var(--muted)" }}>{s.as}</span>
                          <span style={{ color: "var(--faint)" }}>·</span>
                          <span className="mono" style={{ fontWeight: 700, fontSize: 12, color: s.hs > s.as ? "var(--text)" : "var(--muted)" }}>{s.hs}</span>
                          <span className="display" style={{ fontSize: 12, color: h.c2 }}>{s.h}</span>
                          <span className="mono" style={{ fontSize: 9.5, color: s.live ? "var(--cyan)" : "var(--faint)" }}>{s.st}</span>
                        </div>
                      );
                    })}
                  </div>
                ))}
              </div>
            </div>
            {/* scroll body */}
            <div className="phone-scroll" ref={scrollRef} style={{ padding: "16px 16px 28px" }}>{body}</div>
            {/* bottom nav */}
            <nav className="tabbar">
              {NAV.map((n) => {
                const on = view === n.k;
                return (
                  <button key={n.k} onClick={() => go(n.k)} style={{ background: "none", border: "none", cursor: "pointer", color: on ? "var(--amber)" : "var(--muted)", display: "flex", flexDirection: "column", alignItems: "center", gap: 3, padding: "3px 8px" }}>
                    <n.ic size={21} />
                    <span className="heading" style={{ fontSize: 10, fontWeight: 700 }}>{n.label}</span>
                  </button>
                );
              })}
            </nav>
            {/* overlays (scoped to phone) */}
            <Cart open={cartOpen} close={() => setCartOpen(false)} cart={cart} setCart={setCart} checkout={checkout} />
            {buyGame && <BuyModal game={buyGame} close={() => setBuyGame(null)} confirm={confirmBuy} />}
            {seatModal && <SeatModal data={seatModal} close={() => setSeatModal(null)} confirm={(msg) => { setSeatModal(null); flash(msg); }} />}
            {toast && (
              <div className="fade" style={{ position: "absolute", bottom: 78, left: "50%", transform: "translateX(-50%)", zIndex: 70, background: "var(--panel3)", border: "1px solid var(--line2)", borderRadius: 12, padding: "11px 16px", display: "flex", alignItems: "center", gap: 10, boxShadow: "0 12px 40px rgba(0,0,0,.5)", maxWidth: "86%" }}>
                <span style={{ width: 20, height: 20, borderRadius: "50%", background: "var(--good)", display: "flex", alignItems: "center", justifyContent: "center", flex: "none" }}><Check size={13} style={{ color: "#04130a" }} /></span>
                <span className="heading" style={{ fontWeight: 700, fontSize: 13 }}>{toast}</span>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
