function Intent({ score }) {
  const hot = score >= 80, warm = score >= 55;
  const cls = hot ? "hot" : warm ? "warm" : "cool";
  return (
    <span className={`intent ${cls}`}>
      {hot && <Flame size={11} strokeWidth={2.5} />}
      {score}
    </span>
  );
}

function Sparkline({ data, color = "#F76D9C", w = 88, h = 30 }) {
  const max = Math.max(...data), min = Math.min(...data);
  const rng = max - min || 1;
  const pts = data.map((v, i) => `${(i / (data.length - 1)) * w},${h - ((v - min) / rng) * (h - 4) - 2}`).join(" ");
  const id = "g" + color.replace("#", "");
  return (
    <svg width={w} height={h} className="spark">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={color} stopOpacity="0.22" />
          <stop offset="100%" stopColor={color} stopOpacity="0" />
        </linearGradient>
      </defs>
      <polyline points={pts} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      <polygon points={`0,${h} ${pts} ${w},${h}`} fill={`url(#${id})`} />
    </svg>
  );
}

function Delta({ v }) {
  const up = v >= 0;
  return (
    <span className={`delta ${up ? "up" : "down"}`}>
      {up ? <TrendingUp size={12} /> : <TrendingDown size={12} />}
      {Math.abs(v)}%
    </span>
  );
}

function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }
function desat(hex, amt) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  const gray = 0.32 * r + 0.52 * g + 0.16 * b; // blend toward each color's own gray -> keeps lightness, drops saturation
  const mix = (v) => Math.round(v + (gray - v) * amt);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}

function MetricGraph({ color }) {
  const W = 300, H = 100, N = 72;
  const seed = hashStr(color);
  const phase = ((seed % 100) / 100) * Math.PI * 2;
  const mid = 60, a1 = 13, a2 = 6;
  const pts = [];
  for (let i = 0; i <= N; i++) {
    const x = (i / N) * (2 * W); // two identical tiles wide, so translating by one tile loops seamlessly
    const y = mid - (a1 * Math.sin((2 * Math.PI * x) / W + phase) + a2 * Math.sin((4 * Math.PI * x) / W + phase * 1.7));
    pts.push(`${x.toFixed(1)},${y.toFixed(1)}`);
  }
  const line = pts.join(" ");
  const area = `0,${H} ${line} ${2 * W},${H}`;
  const c = desat(color, 0.62); // reduced saturation
  const id = "mg" + seed;
  return (
    <svg className="metricGraph" viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id={id} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor={c} stopOpacity="0.16" />
          <stop offset="60%" stopColor={c} stopOpacity="0.05" />
          <stop offset="100%" stopColor={c} stopOpacity="0" />
        </linearGradient>
      </defs>
      <g className="mgFlow">
        <polygon points={area} fill={`url(#${id})`} />
        <polyline points={line} fill="none" stroke={c} strokeOpacity="0.32" strokeWidth="1.5" vectorEffect="non-scaling-stroke" />
      </g>
    </svg>
  );
}

function MetricCard({ icon: Icon, label, value, delta, spark: sp, color = "#F76D9C" }) {
  return (
    <div className="card metric">
      <MetricGraph data={sp} color={color} />
      <div className="metricInner">
        <span className="metricIcon" style={{ background: `${color}18`, color }}><Icon size={18} /></span>
        <div className="metricText">
          <span className="metricLabel">{label}</span>
          <span className="metricVal">{value}</span>
        </div>
        <Delta v={delta} />
      </div>
    </div>
  );
}

const COMMS = [
  { icon: Inbox, label: "Open conversations", value: "38", delta: 6, spark: [30,34,31,36,33,37,38], color: "#F76D9C" },
  { icon: Reply, label: "Awaiting your reply", value: "12", delta: -18, spark: [20,18,16,15,14,13,12], color: "#D6417A" },
  { icon: Clock, label: "Avg. first response", value: "6m", delta: -38, spark: [14,11,9,12,7,8,6], color: "#8E6BC9" },
  { icon: CheckCheck, label: "Resolved today", value: "27", delta: 14, spark: [12,16,14,19,22,24,27], color: "#C98BA8" },
];

function InboxPage() {
  const [activeId, setActiveId] = useState("c1");
  const [filter, setFilter] = useState("all");
  const [mobileThread, setMobileThread] = useState(false);
  const [closed, setClosed] = useState([]);
  const [listW, setListW] = useState(340);
  const inboxRef = useRef(null);
  const dragging = useRef(false);
  const list = CONVERSATIONS.filter((c) => !closed.includes(c.id) && (filter === "all" || c.channel === filter));
  const conv = list.find((c) => c.id === activeId);

  const closeConv = (id) => {
    const next = list.find((c) => c.id !== id);
    setClosed((prev) => [...prev, id]);
    setActiveId(next ? next.id : null);
    setMobileThread(false);
  };

  const clampW = (w) => {
    const rect = inboxRef.current?.getBoundingClientRect();
    const max = rect ? Math.min(640, rect.width - 400) : 640;
    return Math.max(280, Math.min(max, w));
  };
  useEffect(() => {
    const move = (e) => {
      if (!dragging.current || !inboxRef.current) return;
      setListW(clampW(e.clientX - inboxRef.current.getBoundingClientRect().left));
    };
    const up = () => {
      if (!dragging.current) return;
      dragging.current = false;
      document.body.style.userSelect = "";
      document.body.style.cursor = "";
    };
    window.addEventListener("pointermove", move);
    window.addEventListener("pointerup", up);
    return () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
  }, []);
  const startDrag = (e) => {
    dragging.current = true;
    document.body.style.userSelect = "none";
    document.body.style.cursor = "col-resize";
    e.preventDefault();
  };
  const onResizeKey = (e) => {
    if (e.key === "ArrowLeft") { setListW((w) => clampW(w - 24)); e.preventDefault(); }
    if (e.key === "ArrowRight") { setListW((w) => clampW(w + 24)); e.preventDefault(); }
  };

  return (
    <div className="inboxPage">
      {/* top region: 2x2 metrics on the left, By Channel on the right */}
      <div className="inboxTop">
        <div className="commsMetrics">
          {COMMS.map((m, i) => (
            <MetricCard key={i} icon={m.icon} label={m.label} value={m.value} delta={m.delta} spark={m.spark} color={m.color} />
          ))}
        </div>
        <div className="card inboxChannelCard">
          <div className="cardHead">
            <div><h3>By channel</h3><span className="cardSub">Unanswered vs. received today</span></div>
            <span className="unStat"><b>{CHANNEL_VOL.reduce((a, c) => a + c.un, 0)}</b> unanswered<span className="unStatMuted"> / {CHANNEL_VOL.reduce((a, c) => a + c.v, 0)}</span></span>
          </div>
          <div className="chList">
            {CHANNEL_VOL.map((c) => {
              const max = Math.max(...CHANNEL_VOL.map((x) => x.v));
              return (
                <div className="chListRow" key={c.k}>
                  <ChannelDot ch={c.k} size={20} />
                  <span className="chListName">{CH[c.k].name}</span>
                  <div className="chBarTrack">
                    <div className="chBarFill" style={{ width: `${(c.v / max) * 100}%`, background: CH[c.k].grad || CH[c.k].color }} />
                    <div className="chBarUn" style={{ width: `${(c.un / max) * 100}%` }} title={`${c.un} unanswered`} />
                  </div>
                  <span className="chListVal"><b className="unNum">{c.un}</b><span className="totNum">/{c.v}</span></span>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* inbox panel — filters + search are the panel header, so they read as part of the table */}
      <div className="inbox">
        <div className="inboxToolbar">
          <div className="filterChips">
            <button className={`fchip ${filter === "all" ? "on" : ""}`} onClick={() => setFilter("all")}>All channels</button>
            {Object.keys(CH).map((k) => (
              <button key={k} className={`fchip ${filter === k ? "on" : ""}`} onClick={() => setFilter(k)} title={CH[k].name}>
                <span className="fchipDot" style={{ background: CH[k].grad || CH[k].color }} />{CH[k].name}
              </button>
            ))}
          </div>
          <div className="searchMini inboxSearch"><Search size={15} /><input placeholder="Search conversations" /></div>
        </div>

        <div className={`inboxGrid ${mobileThread ? "showThread" : ""}`} ref={inboxRef} style={{ "--listW": listW + "px" }}>
          {/* list */}
          <div className="inboxList">
            <div className="convScroll">
              {list.map((c) => (
                <button key={c.id} className={`convItem ${c.id === activeId ? "active" : ""}`}
                  onClick={() => { setActiveId(c.id); setMobileThread(true); }}>
                  <Avatar ch={c.channel} name={c.name} bg={c.avatarBg} />
                  <div className="convMid">
                    <div className="convTop"><span className="convName">{c.name}{c.unread && <span className="unreadDot" />}</span><span className="convTime">{c.time}</span></div>
                    <div className="convPreview">{c.last}</div>
                    <div className="convTags"><span className="tag">{c.tag}</span>{c.intent >= 80 && <span className="tag hotTag"><Flame size={10} />High intent</span>}</div>
                  </div>
                </button>
              ))}
            </div>
          </div>

          {/* draggable resizer */}
          <div className="inboxResizer" onPointerDown={startDrag} onKeyDown={onResizeKey}
            role="separator" aria-orientation="vertical" aria-label="Resize conversation list" tabIndex={0}>
            <span className="inboxResizerLine" />
          </div>

          {/* thread */}
          {conv ? (
            <Thread key={conv.id} conv={conv} onBack={() => setMobileThread(false)} onClose={() => closeConv(conv.id)} />
          ) : (
            <div className="threadEmpty">
              <span className="threadEmptyIcon"><Inbox size={26} /></span>
              <p>You're all caught up</p>
              <span>No open conversations in this view.</span>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function Thread({ conv, onBack, onClose }) {
  const [tone, setTone] = useState("friendly");
  const [draft, setDraft] = useState("");
  const [thinking, setThinking] = useState(false);
  const [msgs, setMsgs] = useState(conv.messages);
  const [input, setInput] = useState("");
  const [showPanel, setShowPanel] = useState(false);
  const scrollRef = useRef(null);

  const genDraft = (t = tone) => {
    setThinking(true); setDraft("");
    setTimeout(() => {
      const pack = AI_DRAFTS[t] || AI_DRAFTS.friendly;
      setDraft(pack[conv.id] || pack.default);
      setThinking(false);
    }, 700);
  };
  const send = (text) => {
    if (!text.trim()) return;
    setMsgs((m) => [...m, { from: "me", t: text, time: "now" }]);
    setInput(""); setDraft("");
  };

  // On opening a conversation, the AI proactively drafts a suggested reply to review.
  useEffect(() => { setMsgs(conv.messages); setInput(""); genDraft(tone); /* eslint-disable-line */ }, [conv.id]);
  useEffect(() => { if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight; }, [msgs]);

  return (
    <div className="thread">
      <div className="threadHead">
        <button className="backBtn" onClick={onBack}><ChevronLeft size={20} /></button>
        <Avatar ch={conv.channel} name={conv.name} bg={conv.avatarBg} size={38} />
        <div className="threadWho">
          <div className="threadName">{conv.name}</div>
          <div className="threadSub"><ChannelDot ch={conv.channel} size={15} showName />· {conv.handle}</div>
        </div>
        <div className="threadActions">
          <span className="stageChip">{conv.stage}</span>
          <button className="iconBtn panelToggle" onClick={() => setShowPanel((s) => !s)} title="AI &amp; context"><Sparkles size={16} /></button>
          <button className="iconBtn"><MoreHorizontal size={18} /></button>
          <button className="iconBtn closeConv" onClick={onClose} title="Close conversation" aria-label="Close conversation"><X size={18} /></button>
        </div>
      </div>

      <div className="threadBody">
        <div className="msgScroll" ref={scrollRef}>
          <div className="dayDivider"><span>Today</span></div>
          {msgs.map((m, i) => (
            <div key={i} className={`msg ${m.from === "me" ? "mine" : "theirs"}`}>
              {m.from === "them" && <Avatar ch={conv.channel} name={conv.name} bg={conv.avatarBg} size={28} />}
              <div className="bubble"><p>{m.t}</p><span className="bubbleTime">{m.time}{m.from === "me" && <CheckCheck size={13} />}</span></div>
            </div>
          ))}
        </div>

        <div className="composer">
          {(draft || thinking) ? (
            <div className="aiDraft">
              <div className="aiDraftHead">
                <span className="aiPill sm"><Sparkles size={12} />AI suggested reply</span>
                <div className="toneChips">
                  {["friendly", "professional", "concise"].map((t) => (
                    <button key={t} className={`tone ${tone === t ? "on" : ""}`} onClick={() => { setTone(t); genDraft(t); }} disabled={thinking}>{t}</button>
                  ))}
                </div>
              </div>
              {thinking ? (
                <div className="aiDraftLoading"><span className="spin"><Sparkles size={15} /></span>Writing a reply based on this conversation…</div>
              ) : (
                <>
                  <textarea className="aiDraftText" value={draft} onChange={(e) => setDraft(e.target.value)} rows={3} />
                  <div className="aiHint"><Wand2 size={12} />Review or edit, then send — or dismiss to write your own.</div>
                </>
              )}
              <div className="aiDraftActions">
                <button className="btn ghost sm" onClick={() => genDraft()} disabled={thinking}><RefreshCw size={13} />Regenerate</button>
                <button className="btn ghost sm" onClick={() => setDraft("")} disabled={thinking}>Dismiss</button>
                <button className="btn ai sm" onClick={() => send(draft)} disabled={thinking}><Send size={13} />Send reply</button>
              </div>
            </div>
          ) : (
            <div className="composerBar">
              <button className="iconBtn"><Paperclip size={18} /></button>
              <input className="composerInput" placeholder={`Reply to ${conv.name.split(" ")[0]}…`} value={input}
                onChange={(e) => setInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send(input)} />
              <button className="iconBtn"><Smile size={18} /></button>
              <button className="draftBtn" onClick={() => genDraft()}><Wand2 size={14} />Suggest a reply</button>
              <button className="iconBtn sendBtn" onClick={() => send(input)}><Send size={17} /></button>
            </div>
          )}
        </div>
      </div>

      {/* context / AI panel */}
      <div className={`ctxPanel ${showPanel ? "open" : ""}`}>
        <div className="ctxScroll">
          <div className="ctxCloseRow"><span className="ctxHeading">Customer</span><button className="iconBtn" onClick={() => setShowPanel(false)}><X size={16} /></button></div>
          <div className="ctxCard">
            <Avatar ch={conv.channel} name={conv.name} bg={conv.avatarBg} size={44} />
            <div><div className="ctxName">{conv.name}</div><div className="ctxHandle">{conv.handle}</div></div>
          </div>
          <div className="ctxStat"><span>Lead intent</span><Intent score={conv.intent} /></div>
          <div className="ctxStat"><span>Stage</span><b>{conv.stage}</b></div>
          <div className="ctxStat"><span>Channel</span><ChannelDot ch={conv.channel} size={16} showName /></div>
          <div className="ctxStat"><span>Lifetime value</span><b>$0</b></div>

          <button className="convertBtn"><Zap size={15} />Convert to lead</button>

          <div className="ctxHeading mt">AI summary</div>
          <div className="aiSummary">
            <Sparkles size={13} />
            <p>{conv.tag === "Wholesale" ? "Café owner requesting trade pricing for a 120-unit stoneware order. Strong buying signal — route to sales." :
              conv.tag === "Collab" ? "Creator proposing a paid collaboration for a spring launch. Marketing opportunity; qualify audience size." :
              conv.tag === "Order help" ? "Repeat buyer reporting a chipped item. Resolved with a free replacement — good candidate for a loyalty follow-up." :
              conv.tag === "Availability" ? "Interested in the sage colourway restock. Add to restock list and newsletter." :
              "General product question. Low buying intent — quick answer likely closes it."}</p>
          </div>

          <div className="ctxHeading mt">Suggested next steps</div>
          <ul className="nextSteps">
            <li><Check size={13} />Send wholesale line sheet</li>
            <li><Check size={13} />Add to CRM as a lead</li>
            <li><Check size={13} />Tag for sales follow-up</li>
          </ul>
        </div>
      </div>
    </div>
  );
}

function StatusPill({ status }) {
  const m = STATUS_META[status] || { color: "#A98A94", bg: "var(--line2)" };

function Likelihood({ score }) {
  const cls = score >= 80 ? "hot" : score >= 60 ? "warm" : "cool";
  return (
    <div className="likeCell">
      <div className="likeBar"><div className={`likeFill ${cls}`} style={{ width: `${score}%` }} /></div>
      <span className={`likeNum ${cls}`}>{score}%</span>
    </div>
  );
}

function LeadsPage() {
  const [highOnly, setHighOnly] = useState(false);

  const [toast, setToast] = useState(null);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(null), 3800); return () => clearTimeout(t); }, [toast]);

  const effStatus = (l) => (sent.includes(l.id) ? "With sales" : l.status);
  const sorted = [...LEADS].sort((a, b) => b.intent - a.intent);
  const rows = highOnly ? sorted.filter((l) => l.intent >= 75 && effStatus(l) !== "Won") : sorted;
  const ready = sorted.filter((l) => l.intent >= 75 && effStatus(l) !== "Won" && effStatus(l) !== "With sales").length;
  const openVal = PIPELINE.filter((p) => p.stage !== "Won").reduce((a, p) => a + p.value, 0);

  const doSend = (id, assignee) => {
    const l = LEADS.find((x) => x.id === id);
    setSent((prev) => [...prev, id]);
    setDetail(null);
    setToast(`${l.name} sent to ${assignee}`);
  };

  return (
    <div className="page">
      <div className="pageHead">
        <div><h1>Leads &amp; sales</h1><p className="sub">Every conversation becomes a lead. The hottest are surfaced and handed to sales.</p></div>

        <div className="leadsMetrics">

        </div>
        <PipelineByStage />
        <SalesSnapshot />
      </div>

            <thead><tr><th>Customer</th><th>Channel</th><th>Interest</th><th>Likelihood</th><th>Status</th><th>Value</th><th className="actionCol">Action</th></tr></thead>
            <tbody>
              {rows.map((l) => {
                const st = effStatus(l);
                return (
                  <tr key={l.id} className={l.intent >= 80 && st !== "Won" ? "hotRow" : ""}>
                    <td>
                      <button className="customerBtn" onClick={() => setDetail(l)}>
                        <Avatar ch={l.ch} name={l.name} bg={l.avatarBg} size={30} />
                        <div className="tdLeadWho"><span className="tdLeadName">{l.name}</span><span className="tdLeadHandle">{l.handle}</span></div>
                        <ChevronRight size={15} className="customerChevron" />

                    <td className="muted">{l.src}</td>
                    <td><Likelihood score={l.intent} /></td>
                    <td><StatusPill status={st} /></td>
                    <td><b>${l.value.toLocaleString()}</b></td>
                    <td className="actionCol">
                      {st === "With sales" ? (
                        <button className="withSales asBtn" onClick={() => setDetail(l)}><Check size={13} />With sales</button>
                      ) : st === "Won" ? (
                        <span className="wonMark"><Check size={13} />Won</span>
                      ) : l.intent >= 75 ? (
                        <button className="sendSales" onClick={() => setDetail(l)}>Send to sales<ArrowRight size={14} /></button>
                      ) : (
                        <button className="btn ghost sm" onClick={() => setDetail(l)}>View details</button>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </div>

      {detail && <CustomerModal lead={detail} sent={sent.includes(detail.id)} onClose={() => setDetail(null)} onSend={doSend} />}
      {toast && <div className="toast"><span className="toastIcon"><Check size={14} /></span>{toast} — sales notified</div>}
    </div>
  );
}

const CSS = `
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Poppins:wght@300;400;500;600;700&family=Parisienne&display=swap');

.app *{box-sizing:border-box;margin:0;padding:0}
.app{
  --bg:#FBFAF5; --surface:#FFFFFF; --surface2:#FCEFEC;
  --ink:#43222F; --ink2:#7A5865; --muted:#A98A94;
  --line:#F5DDD9; --line2:#FBEAE6;
  --sidebar:#FFFFFF; --sideInk:#43222F; --sideMuted:#A98A94;
  --accent:#F76D9C; --accentSoft:#FCE4EC; --accentDeep:#D6417A;
  --ai:#8E6BC9; --aiSoft:#EFE9FB;
  --up:#9A5A78; --upSoft:rgba(201,139,168,.20); --down:#D6417A; --warn:#C58B4A;
  --plum:#43222F;
  --shadow:0 2px 6px rgba(190,110,140,.08), 0 18px 40px -16px rgba(190,110,140,.28);
  --shadow-sm:0 1px 3px rgba(190,110,140,.08), 0 8px 20px -12px rgba(190,110,140,.20);
  --fdisp:'Fraunces',Georgia,serif;
  --fsans:'Poppins',system-ui,-apple-system,sans-serif;
  --fscript:'Parisienne',cursive;
  font-family:var(--fsans); color:var(--ink);
  background:var(--bg);
  display:flex; height:100vh; width:100%; overflow:hidden;
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5;
}
.app button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.app input,.app textarea{font-family:inherit}
.app h1,.app h2,.app h3{font-family:var(--fdisp);font-weight:500;letter-spacing:-.015em;color:var(--ink)}
.app ::-webkit-scrollbar{width:9px;height:9px}
.app ::-webkit-scrollbar-thumb{background:#EBCFCB;border-radius:8px;border:2px solid transparent;background-clip:content-box}
.app ::selection{background:var(--accentSoft)}
.app button:focus-visible,.app input:focus-visible,.app a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}

/* ---- sidebar ---- */
.sidebar{width:256px;flex-shrink:0;background:var(--sidebar);color:var(--sideInk);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px;z-index:60}
.brand{display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:11px;padding:6px 8px 22px}
.logo{width:34px;height:34px;display:grid;place-items:center}
.brandName{font-family:var(--fdisp);font-weight:600;font-size:22px;color:var(--ink);letter-spacing:-.02em}
.brandName span{color:var(--accent)}
.brandBiz{grid-column:2;font-size:11px;color:var(--sideMuted);margin-top:-4px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.navItem{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--sideMuted);font-size:14.5px;font-weight:400;transition:.16s;position:relative;width:100%;text-align:left}

.navItem span{flex:1}
.navBadge{background:var(--accent);color:#fff;font-size:11px;font-weight:600;padding:1px 7px;border-radius:100px;flex:0!important}
.navDivider{height:1px;background:var(--line);margin:12px 6px}
.aiSidebarCard{background:var(--aiSoft);border:1px solid #E5DCF6;border-radius:16px;padding:13px;margin-bottom:14px}
.aiSidebarTop{display:flex;align-items:center;gap:7px;color:var(--ink);font-size:13px}

.aiSidebarCard p{font-size:12px;color:var(--ink2);margin-top:6px;line-height:1.4;font-weight:300}
.account{display:flex;align-items:center;gap:10px;padding:9px;border-radius:14px;border:1px solid var(--line);cursor:pointer}
.account:hover{background:var(--surface2)}
.accAva{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#F76D9C,#FFB08A);color:#fff;font-weight:600;font-size:13px;display:grid;place-items:center;flex-shrink:0;font-family:var(--fdisp)}
.accAva.sm{width:32px;height:32px;border-radius:50%}
.accWho{flex:1;display:flex;flex-direction:column;line-height:1.25}
.accWho b{font-size:13px;color:var(--ink);font-weight:600}
.accWho span{font-size:11px;color:var(--sideMuted)}
.account svg{color:var(--sideMuted)}
.sideTagline{font-family:var(--fscript);color:var(--accent);font-size:20px;text-align:center;padding:2px 0 14px;line-height:1}

/* ---- main ---- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:64px;flex-shrink:0;background:rgba(251,250,245,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 24px;z-index:40}
.hamburger{display:none}
.topTitle{font-family:var(--fdisp);font-weight:600;font-size:19px;letter-spacing:-.02em}
.topSearch{margin-left:14px;display:flex;align-items:center;gap:9px;background:var(--surface2);border:1.5px solid var(--line);border-radius:100px;padding:9px 15px;width:340px;color:var(--muted);transition:.16s}
.topSearch:focus-within{border-color:var(--accent);background:#fff}
.topSearch input{border:none;outline:none;background:none;width:100%;font-size:13.5px;color:var(--ink)}
.topActions{margin-left:auto;display:flex;align-items:center;gap:10px}
.iconBtn{width:38px;height:38px;border-radius:100px;display:grid;place-items:center;color:var(--ink2);transition:.16s}
.iconBtn:hover{background:var(--surface2);color:var(--ink)}
.topBtn{position:relative;border:1px solid var(--line);background:var(--surface)}
.notifDot{position:absolute;top:8px;right:9px;width:7px;height:7px;background:var(--down);border-radius:50%;border:1.5px solid var(--surface)}
.onlyMobile{display:none}
.content{flex:1;overflow-y:auto;overflow-x:hidden}

/* ---- generic ---- */
.page{max-width:1240px;margin:0 auto;padding:28px 24px 60px}
.pageHead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.pageHead h1{font-size:30px;font-weight:500}
.sub{color:var(--ink2);font-size:14px;margin-top:4px;font-weight:300}
.pageHeadActions{display:flex;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--shadow-sm)}
.cardHead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.cardHead h3{font-size:18px;font-weight:500}
.cardSub{font-size:12.5px;color:var(--muted);display:block;margin-top:2px;font-weight:300}
.grid{display:grid;gap:16px;margin-bottom:16px}
.metrics{grid-template-columns:repeat(4,1fr)}
.two-one{grid-template-columns:1.7fr 1fr}
.btn{display:inline-flex;align-items:center;gap:7px;padding:10px 18px;border-radius:100px;font-size:14px;font-weight:500;transition:transform .14s,box-shadow .14s,border-color .14s;white-space:nowrap}
.btn.full{width:100%;justify-content:center}
.btn.sm{padding:8px 14px;font-size:12.5px}
.btn.primary{background:var(--plum);color:var(--surface2)}
.btn.primary:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accentDeep)}
.btn.ai{background:linear-gradient(135deg,#F76D9C,#FFB08A);color:#fff;box-shadow:0 8px 20px -8px rgba(247,109,156,.55)}
.btn.ai:hover{transform:translateY(-2px)}

/* metric card */
.metric{position:relative;overflow:hidden;padding:16px 18px;min-height:104px}
.metricGraph{position:absolute;left:0;right:0;bottom:0;width:100%;height:66px;z-index:0;pointer-events:none;opacity:0;animation:mgFade .7s ease forwards}
@keyframes mgFade{to{opacity:1}}
.mgFlow{transform:translateX(0);animation:mgFlow 10s linear infinite;will-change:transform}
@keyframes mgFlow{to{transform:translateX(-300px)}}
.metrics .metric:nth-child(1) .mgFlow{animation-duration:11s}
.metrics .metric:nth-child(2) .mgFlow{animation-duration:8s}
.metrics .metric:nth-child(3) .mgFlow{animation-duration:13s}
.metrics .metric:nth-child(4) .mgFlow{animation-duration:9.5s}
.metricInner{position:relative;z-index:1;display:flex;align-items:center;gap:13px}
.metricIcon{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex-shrink:0}
.metricText{display:flex;flex-direction:column;gap:2px;min-width:0}
.metricLabel{font-size:12.5px;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.metricVal{font-family:var(--fdisp);font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.02}
.metricInner .delta{margin-left:auto;align-self:flex-start}
.spark{display:block}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:600;padding:4px 9px;border-radius:100px}
.delta.up{color:var(--up);background:var(--upSoft)}
.delta.down{color:var(--up);background:var(--upSoft)}

/* legend + charts */
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:3px}
.chartBox{margin:0 -6px}
.tip{background:var(--ink);color:#fff;border-radius:10px;padding:8px 11px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.tipLabel{font-weight:600;margin-bottom:4px;font-family:var(--fdisp)}
.tipRow{display:flex;align-items:center;gap:6px;color:#d5d5db;padding:1px 0}
.tipRow b{color:#fff}
.tipDot{width:8px;height:8px;border-radius:2px}

/* channel list */
.chList{display:flex;flex-direction:column;gap:15px}
.chListRow{display:grid;grid-template-columns:auto 1fr 90px auto;align-items:center;gap:11px}
.chListName{font-size:13px;font-weight:500}
.chBarTrack{height:8px;background:var(--line2);border-radius:20px;overflow:hidden}
.chBarFill{height:100%;border-radius:20px}
.chListVal{font-family:var(--fdisp);font-weight:600;font-size:14px;text-align:right}
.inboxChannelCard .chBarTrack{position:relative}
.inboxChannelCard .chBarFill{position:absolute;left:0;top:0;opacity:.5}
.inboxChannelCard .chBarUn{position:absolute;left:0;top:0;height:100%;border-radius:20px;background:var(--down)}
.inboxChannelCard .chListVal{font-weight:400;font-size:13.5px;white-space:nowrap}
.unNum{color:var(--down);font-weight:600}
.totNum{color:var(--muted);font-weight:500}
.unStat{font-size:12px;color:var(--ink2);white-space:nowrap}
.unStat b{font-family:var(--fdisp);color:var(--down);font-size:15px}
.unStatMuted{color:var(--muted)}
.chDotRow{display:inline-flex;align-items:center;gap:7px}
.chDot{border-radius:7px;display:grid;place-items:center;flex-shrink:0}
.chDotTxt{color:#fff;font-weight:700;font-family:var(--fdisp);line-height:1}
.chName{font-size:13px}

/* aiPill (shared) */
.insightsTitle{display:flex;flex-direction:column;gap:6px}
.aiPill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--ai);background:var(--aiSoft);padding:4px 10px;border-radius:20px;width:fit-content}
.aiPill.sm{font-size:11px;padding:3px 8px}
.aiPill.lg{font-size:13px;padding:7px 13px;box-shadow:0 2px 10px rgba(142,107,201,.18)}

/* insights — WORTH A LOOK, standout key piece */
.insightsPanel{position:relative;overflow:hidden;margin-bottom:16px;padding:22px 22px 24px;border-radius:20px;
  background:linear-gradient(135deg,#FDECF2 0%,#FFF6F0 52%,#FCEFF7 100%);
  border:1px solid #F3D9E4;box-shadow:0 10px 30px rgba(247,109,156,.06)}
.insightsGlow{position:absolute;top:-90px;right:-60px;width:280px;height:280px;border-radius:50%;
  background:radial-gradient(circle,rgba(142,107,201,.20),transparent 66%);pointer-events:none;filter:blur(6px)}
.insightsPanelHead{position:relative;z-index:1;display:flex;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.insightsHeadLeft{display:flex;align-items:center;gap:13px}
.insightsH{font-size:19px;font-weight:600;line-height:1.1}
.signalCount{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--ai);background:rgba(255,255,255,.75);border:1px solid #E0D4F5;padding:5px 12px;border-radius:20px}
.insightRail{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
.insight{display:flex;gap:12px;text-align:left;padding:16px;border:1px solid rgba(255,255,255,.9);border-radius:15px;background:rgba(255,255,255,.92);backdrop-filter:blur(4px);transition:.18s;align-items:flex-start;box-shadow:0 2px 8px rgba(20,20,30,.04)}
.insight:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(20,20,30,.1);border-color:#fff}
.insightIcon{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;color:#fff}
.insight.up .insightIcon{background:linear-gradient(135deg,#D3A0BC,#C98BA8)}
.insight.warn .insightIcon{background:linear-gradient(135deg,#F2C48E,#E8B06A)}
.insight.info .insightIcon{background:linear-gradient(135deg,#F98BB0,#F76D9C)}
.insightBody{min-width:0}
.insightTitle{font-weight:600;font-size:13.5px;margin-bottom:5px;line-height:1.3}
.insightBody p{font-size:12px;color:var(--ink2);line-height:1.45}
.insightCta{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;color:var(--accent);margin-top:10px}
.insight:hover .insightCta svg{transform:translateX(3px)}
.insightCta svg{transition:transform .18s}

/* funnel */
.funnelCard{margin-bottom:16px}
.funnel{display:flex;flex-direction:column;gap:17px}
.funnelRow{position:relative}
.funnelMeta{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:7px}
.funnelLabel{display:inline-flex;align-items:center;gap:8px;font-weight:500}
.funnelKey{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.funnelNums{display:inline-flex;align-items:center;gap:12px}
.funnelNums b{font-family:var(--fdisp);font-weight:600;font-size:15px}
.funnelTrack{height:12px;background:var(--line2);border-radius:20px;overflow:hidden}
.funnelFill{height:100%;border-radius:20px;transition:width .6s cubic-bezier(.22,1,.36,1)}
.funnelConv{font-size:11px;color:var(--muted);font-weight:600;background:var(--surface2);border:1px solid var(--line);padding:2px 9px;border-radius:20px;white-space:nowrap}
.funnelFoot{display:flex;justify-content:space-between;align-items:center;padding-top:15px;margin-top:3px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.funnelFoot b{font-family:var(--fdisp);font-size:22px;font-weight:600;color:var(--accent)}

/* intent */
.intent{display:inline-flex;align-items:center;gap:3px;font-family:var(--fdisp);font-weight:600;font-size:12.5px;padding:3px 9px;border-radius:8px}
.intent.hot{color:var(--down);background:rgba(214,65,122,.11)}
.intent.warm{color:var(--warn);background:rgba(232,176,106,.12)}
.intent.cool{color:var(--ink2);background:var(--line2)}

/* ============ INBOX ============ */
.inboxPage{display:flex;flex-direction:column;min-height:100%;padding:22px 24px 24px;min-width:0}
.commsMetrics{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;margin-bottom:0}
.commsMetrics .metric{min-height:0;padding:14px 16px}
.commsMetrics .metricInner{display:flex;align-items:center;gap:12px;height:100%}
.commsMetrics .metricText{flex-direction:column-reverse;align-items:flex-start;text-align:left;gap:2px}
.commsMetrics .metricInner .delta{margin-left:auto;align-self:center}
.commsMetrics .metricIcon{width:34px;height:34px;border-radius:10px}
.commsMetrics .metricIcon svg{width:16px;height:16px}
.commsMetrics .metricVal{font-size:23px}
.commsMetrics .metricLabel{font-size:11.5px;white-space:normal;line-height:1.25}
.commsMetrics .metricGraph{height:44px}
.commsMetrics .metric:nth-child(1) .mgFlow{animation-duration:11s}
.commsMetrics .metric:nth-child(2) .mgFlow{animation-duration:8s}
.commsMetrics .metric:nth-child(3) .mgFlow{animation-duration:13s}
.commsMetrics .metric:nth-child(4) .mgFlow{animation-duration:9.5s}
.inboxTop{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;margin-bottom:14px;align-items:stretch}
.inboxChannelCard{padding:15px 18px;margin-bottom:0;display:flex;flex-direction:column}
.inboxChannelCard .cardHead{margin-bottom:13px}
.inboxChannelCard .chList{display:flex;flex-direction:column;justify-content:space-between;gap:10px;flex:1}
.inboxToolbar{display:flex;align-items:center;gap:14px;justify-content:space-between;padding:11px 12px;border-bottom:1px solid var(--line);background:var(--surface);flex-wrap:wrap;border-radius:16px 16px 0 0}
.inboxToolbar .filterChips{flex:1;flex-wrap:wrap;overflow:visible;min-width:0}
.inboxSearch{margin-bottom:0;width:250px;flex-shrink:0}
.inbox{display:flex;flex-direction:column;flex:1;min-height:480px;overflow:hidden;border:1px solid var(--line);border-radius:16px;background:var(--surface)}
.inboxGrid{display:grid;grid-template-columns:var(--listW,340px) 7px 1fr;flex:1;min-height:0;overflow:hidden}
.inboxResizer{position:relative;cursor:col-resize;display:flex;align-items:center;justify-content:center;background:var(--surface2);border-left:1px solid var(--line);border-right:1px solid var(--line);transition:background .15s;touch-action:none;z-index:6}
.inboxResizer::after{content:"";position:absolute;top:0;bottom:0;left:-4px;right:-4px}
.inboxResizer:hover,.inboxResizer:focus-visible{background:var(--accentSoft);outline:none}
.inboxResizerLine{width:2px;height:34px;border-radius:2px;background:#E6C9C4;transition:.15s;pointer-events:none}
.inboxResizer:hover .inboxResizerLine,.inboxResizer:focus-visible .inboxResizerLine{background:var(--accent);height:48px}
.inboxList{border-right:1px solid var(--line);display:flex;flex-direction:column;background:var(--surface);min-width:0}
.countPill{font-size:11px;font-weight:600;color:var(--accent);background:var(--accentSoft);padding:3px 9px;border-radius:20px}
.searchMini{display:flex;align-items:center;gap:8px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--muted)}
.searchMini:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.searchMini input{border:none;outline:none;background:none;width:100%;font-size:13px;color:var(--ink)}
.filterChips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.filterChips::-webkit-scrollbar{display:none}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:20px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap;transition:.14s}
.fchip:hover{border-color:#EAD4D0}
.fchip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.fchipDot{width:9px;height:9px;border-radius:50%}
.convScroll{overflow-y:auto;flex:1}
.convItem{display:flex;gap:12px;padding:14px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line2);transition:.14s;position:relative}
.convItem:hover{background:var(--surface2)}
.convItem.active{background:var(--accentSoft)}
.convItem.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.convMid{flex:1;min-width:0}
.convTop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.convName{font-weight:600;font-size:13.5px;display:flex;align-items:center;gap:6px}
.unreadDot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.convTime{font-size:11px;color:var(--muted);flex-shrink:0}
.convPreview{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:3px 0 7px}
.convTags{display:flex;gap:6px}
.tag{font-size:10.5px;font-weight:600;color:var(--ink2);background:var(--line2);padding:2px 8px;border-radius:6px}
.hotTag{display:inline-flex;align-items:center;gap:3px;color:var(--down);background:rgba(214,65,122,.1)}

/* avatar */
.avaWrap{position:relative;flex-shrink:0}
.ava{border-radius:11px;display:grid;place-items:center;font-family:var(--fdisp);font-weight:600;font-size:14px;color:#4a4a52}
.avaBadge{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:6px;border:2px solid var(--surface);display:grid;place-items:center}
.avaBadgeTxt{color:#fff;font-size:8px;font-weight:700;font-family:var(--fdisp);line-height:1}

/* thread */
.thread{display:grid;grid-template-columns:1fr;grid-template-rows:auto 1fr;min-width:0;position:relative}
.threadHead{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--line);background:var(--surface)}
.backBtn{display:none;width:36px;height:36px;border-radius:9px;place-items:center;color:var(--ink2)}
.threadWho{flex:1;min-width:0}
.threadName{font-weight:600;font-size:15px}
.threadSub{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:1px}
.threadActions{display:flex;align-items:center;gap:6px}
.stageChip{font-size:11.5px;font-weight:600;color:var(--accent);background:var(--accentSoft);padding:5px 11px;border-radius:8px}
.closeConv:hover{background:rgba(214,65,122,.1);color:var(--down)}
.panelToggle{display:none;border:1px solid var(--line)}
.threadBody{display:flex;flex-direction:column;min-height:0;background:var(--surface2)}
.msgScroll{flex:1;overflow-y:auto;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.dayDivider{text-align:center;position:relative;margin:2px 0 6px}
.dayDivider span{font-size:11px;color:var(--muted);background:var(--surface2);padding:0 12px;position:relative;z-index:1;font-weight:500}
.dayDivider::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.msg{display:flex;gap:9px;max-width:74%}
.msg.theirs{align-self:flex-start;align-items:flex-end}
.msg.mine{align-self:flex-end;flex-direction:row-reverse}
.bubble{padding:11px 15px;border-radius:16px;position:relative}
.msg.theirs .bubble{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px}
.msg.mine .bubble{background:var(--accent);color:#fff;border-bottom-right-radius:5px}
.bubble p{font-size:13.5px;line-height:1.5}
.bubbleTime{display:flex;align-items:center;gap:4px;justify-content:flex-end;font-size:10.5px;margin-top:5px;opacity:.65}
.msg.mine .bubbleTime{color:#fff}
.msg.theirs .bubbleTime{color:var(--muted)}

/* composer */
.composer{border-top:1px solid var(--line);background:var(--surface);padding:14px 18px}
.composerBar{display:flex;align-items:center;gap:6px}
.composerInput{flex:1;border:none;outline:none;background:none;font-size:14px;padding:8px 4px}
.draftBtn{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#fff;background:var(--ai);padding:8px 13px;border-radius:10px;transition:.14s;white-space:nowrap;box-shadow:0 2px 8px rgba(142,107,201,.28)}
.draftBtn:hover{background:#7A57B8}
.draftBtn:disabled{opacity:.7}
.sendBtn{background:var(--accent);color:#fff}
.sendBtn:hover{background:#D6417A;color:#fff}
.spin{display:inline-flex;animation:spin 1s linear infinite;color:var(--ai)}
@keyframes spin{to{transform:rotate(360deg)}}
.aiDraft{position:relative;border:1.5px solid #DDD1F2;background:linear-gradient(180deg,#FAF4FF,#fff);border-radius:14px;padding:14px;box-shadow:0 4px 18px rgba(142,107,201,.12)}
.aiDraft::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--ai)}
.aiDraftHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap;padding-left:8px}
.toneChips{display:flex;gap:4px;background:var(--surface2);padding:3px;border-radius:9px;border:1px solid var(--line)}
.tone{font-size:11.5px;font-weight:500;padding:5px 10px;border-radius:7px;color:var(--ink2);text-transform:capitalize;transition:.14s}
.tone.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08);font-weight:600}
.tone:disabled{opacity:.5}
.aiDraftText{width:100%;border:1px solid #E0D4F5;border-radius:10px;padding:11px;font-size:13.5px;line-height:1.5;resize:none;outline:none;color:var(--ink);background:var(--surface)}
.aiDraftText:focus{border-color:var(--ai);box-shadow:0 0 0 3px rgba(142,107,201,.12)}
.aiDraftLoading{display:flex;align-items:center;gap:9px;font-size:13px;color:#4A3A6B;padding:14px 4px}
.aiHint{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted);margin-top:8px}
.aiDraftActions{display:flex;gap:8px;margin-top:11px;justify-content:flex-end;flex-wrap:wrap}
.threadEmpty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;color:var(--muted);background:var(--surface2)}
.threadEmptyIcon{width:56px;height:56px;border-radius:16px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink2);margin-bottom:6px}
.threadEmpty p{font-family:var(--fdisp);font-weight:600;font-size:16px;color:var(--ink)}
.threadEmpty span{font-size:13px}

/* ctx panel */
.ctxPanel{position:absolute;top:0;right:0;bottom:0;width:302px;background:var(--surface);border-left:1px solid var(--line);transform:translateX(100%);transition:.28s cubic-bezier(.4,0,.2,1);z-index:20}
.ctxPanel.open{transform:translateX(0);box-shadow:-14px 0 40px rgba(0,0,0,.08)}
.ctxScroll{height:100%;overflow-y:auto;padding:18px}
.ctxCloseRow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.ctxHeading{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.ctxHeading.mt{margin-top:22px;margin-bottom:11px;display:block}
.ctxCard{display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface2);border-radius:13px;border:1px solid var(--line);margin-bottom:14px}
.ctxName{font-weight:600;font-size:14px}
.ctxHandle{font-size:12px;color:var(--muted)}
.ctxStat{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line2);font-size:13px;color:var(--ink2)}
.ctxStat b{color:var(--ink);font-weight:600}
.convertBtn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;margin-top:16px;padding:11px;border-radius:11px;background:var(--ink);color:#fff;font-weight:600;font-size:13.5px;transition:.16s}
.convertBtn:hover{background:#000;transform:translateY(-1px)}
.aiSummary{display:flex;gap:9px;background:var(--aiSoft);border-radius:11px;padding:12px}
.aiSummary svg{color:var(--ai);flex-shrink:0;margin-top:2px}
.aiSummary p{font-size:12.5px;line-height:1.5;color:#4A3A6B}
.nextSteps{list-style:none;display:flex;flex-direction:column;gap:9px}
.nextSteps li{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2)}
.nextSteps svg{color:var(--up);background:rgba(201,139,168,.13);border-radius:50%;padding:2px;width:18px;height:18px;flex-shrink:0}

/* ============ LEADS ============ */
.leadsTop{display:grid;grid-template-columns:0.9fr 1.2fr 1fr;gap:16px;align-items:stretch;margin-bottom:18px}
.leadsMetrics{display:flex;flex-direction:column;gap:10px;align-self:stretch}
.leadsMetrics .metric{min-height:0;padding:12px 15px;flex:1;display:flex;align-items:center}
.leadsMetrics .metricInner{width:100%;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:11px;row-gap:2px;align-items:center}
.leadsMetrics .metricText{display:contents}
.leadsMetrics .metricIcon{width:32px;height:32px;border-radius:9px;grid-column:1;grid-row:1}
.leadsMetrics .metricIcon svg{width:16px;height:16px}
.leadsMetrics .metricVal{font-size:20px;grid-column:2;grid-row:1;justify-self:start}
.leadsMetrics .metricLabel{font-size:11.5px;white-space:nowrap;line-height:1.2;grid-column:2;grid-row:2;justify-self:start}
.leadsMetrics .metricInner .delta{grid-column:3;grid-row:1;margin-left:0;align-self:center;justify-self:end}
.leadsMetrics .metricGraph{height:32px}
.leadsMetrics .metric:nth-child(1) .mgFlow{animation-duration:11s}
.leadsMetrics .metric:nth-child(2) .mgFlow{animation-duration:8s}
.leadsMetrics .metric:nth-child(3) .mgFlow{animation-duration:13s}
.leadsMetrics .metric:nth-child(4) .mgFlow{animation-duration:9.5s}
.segmented,.select{user-select:none}
.segmented{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.segmented button{font-size:13px;font-weight:600;padding:7px 16px;border-radius:8px;color:var(--muted)}
.segmented button.on{background:var(--ink);color:#fff}
.metrics.four{grid-template-columns:repeat(4,1fr)}
.hotStrip{display:flex;align-items:center;gap:12px;padding:13px 16px;background:linear-gradient(90deg,rgba(214,65,122,.06),rgba(214,65,122,0));border:1px solid rgba(214,65,122,.16);border-radius:14px;margin-bottom:18px;overflow-x:auto}
.hotStripLabel{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--down);white-space:nowrap}
.hotChip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:7px 12px;white-space:nowrap}
.hotName{font-size:13px;font-weight:600}
.hotVal{font-family:var(--fdisp);font-weight:600;font-size:13px;color:var(--ink2)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:start}
.boardCol{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:12px}
.boardColHead{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:4px 6px 12px}
.boardCount{margin-left:auto;font-size:11.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:1px 8px;border-radius:20px}
.stageDot{width:9px;height:9px;border-radius:50%}
.stageDot.new{background:var(--accent)} .stageDot.qualified{background:var(--warn)}
.stageDot.working{background:#E39AB8} .stageDot.won{background:var(--up)}
.boardCards{display:flex;flex-direction:column;gap:10px}
.leadCard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px;transition:.16s;cursor:pointer}
.leadCard:hover{border-color:#EAD4D0;box-shadow:0 6px 16px rgba(0,0,0,.06);transform:translateY(-2px)}
.leadCardTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.leadName{font-weight:600;font-size:13.5px}
.leadSrc{font-size:12px;color:var(--muted);margin:2px 0 11px}
.leadFoot{display:flex;align-items:center;justify-content:space-between}
.leadVal{font-family:var(--fdisp);font-weight:600;font-size:14px}
.leadOwner{width:24px;height:24px;border-radius:7px;background:var(--line2);display:grid;place-items:center;font-size:10.5px;font-weight:600;color:var(--ink2);font-family:var(--fdisp)}

/* table */
.tableCard{padding:6px 4px}
.dataTable{width:100%;border-collapse:collapse}
.dataTable th{text-align:left;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:13px 16px;border-bottom:1px solid var(--line)}
.dataTable td{padding:13px 16px;font-size:13.5px;border-bottom:1px solid var(--line2)}
.dataTable tr:last-child td{border-bottom:none}
.dataTable tbody tr{transition:.12s}
.dataTable tbody tr:hover{background:var(--surface2)}
.hotRow{background:rgba(214,65,122,.03)}
.tdLead{display:flex;align-items:center;gap:11px;font-weight:600}
.muted{color:var(--muted)}
.stagePill{font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px}
.stagePill.new{color:var(--accent);background:var(--accentSoft)}
.stagePill.qualified{color:var(--warn);background:rgba(232,176,106,.12)}
.stagePill.working{color:#F76D9C;background:#FCE4EC}
.stagePill.won{color:var(--up);background:rgba(201,139,168,.12)}
.ownerAva{width:26px;height:26px;border-radius:7px;background:var(--line2);display:inline-grid;place-items:center;font-size:11px;font-weight:600;color:var(--ink2);font-family:var(--fdisp)}
.convBadge{font-family:var(--fdisp);font-weight:600;color:var(--ink2)}

/* pipeline by stage */
.pipeTotal{font-family:var(--fdisp);font-weight:600;font-size:13px;color:var(--accent)}
.pipeList{display:flex;flex-direction:column;gap:15px}
.pipeRow{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center}
.pipeMeta{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:2px}
.pipeStage{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500}
.pipeDot{width:9px;height:9px;border-radius:3px}
.pipeCount{font-size:11.5px;color:var(--muted);padding-left:17px}
.pipeVal{grid-column:2;grid-row:1;justify-self:end;font-family:var(--fdisp);font-weight:600;font-size:14px;color:var(--ink2)}
.pipeBarTrack{grid-column:1 / -1;grid-row:2;height:8px;background:var(--line2);border-radius:20px;overflow:hidden}
.pipeBarFill{height:100%;border-radius:20px}

/* sales snapshot */
.snapList{display:flex;flex-direction:column}
.snapRow{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line2);font-size:13px;color:var(--ink2)}
.snapRow:last-child{border-bottom:none}
.snapRow b{font-family:var(--fdisp);font-weight:600;font-size:15px;color:var(--ink)}

/* leads table (key feature) */
.leadsTableCard{padding:0;border-color:#F3D9E4;box-shadow:0 14px 38px rgba(247,109,156,.09)}
.leadsTitleRow{display:flex;align-items:center;gap:10px}
.leadsTitleIcon{width:32px;height:32px;border-radius:10px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center}
.leadsTableHead{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:linear-gradient(180deg,#FFF7FB,#fff)}
.leadsTableTitle h3{font-size:18px;font-weight:600}
.leadsTableTitle .cardSub{margin-top:5px;margin-left:42px}
.leadsTableTools{display:flex;align-items:center;gap:12px}
.readyPill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--down);background:rgba(214,65,122,.1);padding:6px 11px;border-radius:20px;white-space:nowrap}
.tableScroll{overflow-x:auto}
.leadsTable td{padding:12px 16px}
.tdLeadWho{display:flex;flex-direction:column;line-height:1.3}
.tdLeadName{font-weight:600;font-size:13.5px}
.tdLeadHandle{font-size:11.5px;color:var(--muted);font-weight:400}
.likeCell{display:flex;align-items:center;gap:9px;min-width:120px}
.likeBar{flex:1;height:7px;background:var(--line2);border-radius:20px;overflow:hidden;min-width:56px}
.likeFill{height:100%;border-radius:20px}
.likeFill.hot{background:var(--down)} .likeFill.warm{background:var(--warn)} .likeFill.cool{background:#B9B9C2}
.likeNum{font-family:var(--fdisp);font-weight:600;font-size:12.5px;min-width:32px}
.likeNum.hot{color:var(--down)} .likeNum.warm{color:var(--warn)} .likeNum.cool{color:var(--muted)}
.statusTag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px;white-space:nowrap}
.actionCol{text-align:right}
.customerBtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;padding:2px;border-radius:8px;transition:.14s}
.customerBtn:hover{background:transparent}
.customerBtn:hover .tdLeadName{color:var(--accent)}
.customerChevron{color:var(--muted);margin-left:2px;opacity:0;transform:translateX(-3px);transition:.15s}
.customerBtn:hover .customerChevron{opacity:1;transform:translateX(0)}
.cmName{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;font-family:var(--fdisp)}
.cmLikeRow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 14px;background:var(--surface2);border:1px solid var(--line);border-radius:12px}
.cmLikeLabel{font-size:12.5px;font-weight:600;color:var(--ink2)}
.cmLikeRow .likeCell{min-width:150px;flex:0 0 auto}
.modalFootNote{flex:1;min-width:0}
.modalFootBtns{display:flex;gap:10px;flex-shrink:0}
.nurtureNote{font-size:12.5px;color:var(--muted)}
.withSales.asBtn{cursor:pointer;transition:.14s}
.withSales.asBtn:hover{background:rgba(201,139,168,.18)}
.sendSales{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:#fff;background:var(--ink);padding:8px 13px;border-radius:9px;transition:.15s;white-space:nowrap}
.sendSales:hover{background:#000;transform:translateY(-1px);box-shadow:0 4px 12px rgba(0,0,0,.18)}
.sendSales svg{transition:transform .15s}
.sendSales:hover svg{transform:translateX(2px)}
.withSales{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--up);background:rgba(201,139,168,.1);padding:6px 11px;border-radius:9px;white-space:nowrap}
.wonMark{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}

/* handoff modal */
.modalScrim{position:fixed;inset:0;background:rgba(20,20,25,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:20px;z-index:200;animation:fadeIn .18s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:520px;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 70px rgba(0,0,0,.32);animation:modalPop .22s cubic-bezier(.22,1,.36,1)}
@keyframes modalPop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modalHead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px;border-bottom:1px solid var(--line)}
.modalTitleRow{display:flex;align-items:center;gap:12px}
.modalTitleRow h3{font-size:17px;font-weight:600}
.handIcon{width:38px;height:38px;border-radius:11px;background:var(--ink);color:#fff;display:grid;place-items:center}
.modalBody{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.handCustomer{display:flex;align-items:center;gap:13px;padding:14px;background:var(--surface2);border:1px solid var(--line);border-radius:13px}
.handWho{flex:1;min-width:0}
.handName{font-weight:600;font-size:15px}
.handSub{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:2px}
.handLike{flex-shrink:0}
.handGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.handGrid div{background:var(--surface2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
.handGrid span{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}
.handGrid b{font-family:var(--fdisp);font-weight:600;font-size:14px}
.handSection h4{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.handSection p{font-size:13.5px;line-height:1.55;color:var(--ink2)}
.signalList{list-style:none;display:flex;flex-direction:column;gap:8px}
.signalList li{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2)}
.signalList svg{color:var(--up);background:rgba(201,139,168,.13);border-radius:50%;padding:2px;width:18px;height:18px;flex-shrink:0}
.handNote{display:flex;gap:9px;background:var(--aiSoft);border-radius:12px;padding:12px 13px}
.handNote svg{color:var(--ai);flex-shrink:0;margin-top:1px}
.handNote p{font-size:12.5px;line-height:1.5;color:#4A3A6B}
.assignRow{display:flex;gap:8px;flex-wrap:wrap}
.assignChip{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:500;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:20px;color:var(--ink2);transition:.14s}
.assignChip:hover{border-color:#EAD4D0}
.assignChip.on{border-color:var(--accent);background:var(--accentSoft);color:var(--accent)}
.assignAva{width:24px;height:24px;border-radius:50%;background:var(--line2);display:grid;place-items:center;font-size:10.5px;font-weight:600;font-family:var(--fdisp);color:var(--ink2)}
.assignChip.on .assignAva{background:var(--accent);color:#fff}
.modalFoot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-top:1px solid var(--line)}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:500;padding:12px 18px;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.3);z-index:210;animation:toastUp .3s cubic-bezier(.22,1,.36,1)}
@keyframes toastUp{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.toastIcon{width:22px;height:22px;border-radius:50%;background:var(--up);display:grid;place-items:center;flex-shrink:0}

/* ============ MARKETING ============ */
.tabsRow{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:4px;width:fit-content;margin-bottom:18px}
.tab{font-size:13px;font-weight:600;padding:8px 18px;border-radius:8px;color:var(--muted);transition:.14s}
.tab.on{background:var(--accentSoft);color:var(--accent)}
.statusPill{font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:20px}
.statusPill.sent{color:var(--up);background:rgba(201,139,168,.12)}
.statusPill.scheduled{color:var(--accent);background:var(--accentSoft)}
.statusPill.draft{color:var(--muted);background:var(--line2)}
.campIcon{width:30px;height:30px;border-radius:8px;background:var(--accentSoft);color:var(--accent);display:grid;place-items:center}
.rateBar{display:flex;align-items:center;gap:9px}
.rateTrack{width:80px;height:7px;background:var(--line2);border-radius:20px;overflow:hidden}
.rateFill{height:100%;border-radius:20px}
.rateVal{font-family:var(--fdisp);font-weight:600;font-size:12.5px;min-width:34px}
.sourceRow{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line)}
.sourceItem{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink2)}
.sourceDot{width:10px;height:10px;border-radius:3px}
.sourceItem b{color:var(--ink);font-family:var(--fdisp)}
.subList{display:flex;flex-direction:column}
.subItem{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 2px;border-bottom:1px solid var(--line2)}
.subItem:last-child{border-bottom:none}
.subMail{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.subMeta{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);flex-shrink:0}
.subMeta svg{color:var(--ink2)}
.subTime{color:var(--muted)}

/* composer (newsletter) */
.composeGrid{align-items:start}
.composeSetup h3{margin-bottom:16px}
.fld{display:block;margin-bottom:15px}
.fld span{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin-bottom:7px}
.fld input{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13.5px;outline:none}
.fld input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentSoft)}
.select{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:10px;padding:11px 13px;font-size:13.5px;color:var(--ink2)}
.radioRow{display:flex;gap:8px}
.radio{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px;font-weight:600;color:var(--ink2)}
.radio.on{border-color:var(--accent);background:var(--accentSoft);color:var(--accent)}
.aiAssistBox{background:linear-gradient(180deg,#FBF4FF,#fff);border:1px solid var(--aiSoft);border-radius:12px;padding:14px;margin:6px 0 16px}
.aiAssistBox p{font-size:12.5px;color:var(--ink2);margin:8px 0 11px;line-height:1.45}
.composeFoot{display:flex;gap:10px;justify-content:flex-end;padding-top:6px}
.emailPreview{padding:0;overflow:hidden}
.emailBar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted);font-weight:500}
.dots{display:flex;gap:5px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.emailCanvas{padding:30px 28px 26px;text-align:center}
.emailLogo{font-family:var(--fdisp);font-weight:600;letter-spacing:.18em;font-size:13px;color:var(--ink)}
.emailHero{height:150px;border-radius:12px;margin:20px 0;background:linear-gradient(135deg,#E7E0D4,#C9B79E 60%,#A88E6E);position:relative;overflow:hidden}
.emailHero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 70% 30%,rgba(255,255,255,.4),transparent 55%)}
.emailH{font-size:21px;font-weight:600;margin-bottom:10px}
.emailP{font-size:13.5px;color:var(--ink2);line-height:1.55;max-width:340px;margin:0 auto 18px}
.emailCta{background:var(--ink);color:#fff;font-weight:600;font-size:13px;padding:12px 26px;border-radius:10px}
.emailFine{font-size:10.5px;color:var(--muted);margin-top:22px}

/* ============ CHANNELS ============ */
.channelGrid{grid-template-columns:repeat(3,1fr)}
.channelCard{display:flex;flex-direction:column;gap:4px}
.channelCard.on{border-color:#EAD4D0}
.channelCardTop{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.connState{font-size:11px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:4px}
.connState.conn{color:var(--up)}
.channelCardName{font-family:var(--fdisp);font-weight:600;font-size:16px}
.channelCardMeta{font-size:12.5px;color:var(--muted);margin-bottom:14px;flex:1}
.aiSettings{margin-top:16px}
.toggleRow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px 0;border-bottom:1px solid var(--line2)}
.toggleRow b{font-size:14px;font-weight:600}
.toggleRow p{font-size:12.5px;color:var(--muted);margin-top:3px}
.switch{width:42px;height:24px;border-radius:20px;background:var(--line);position:relative;flex-shrink:0;transition:.2s;cursor:pointer}
.switch span{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--accent)}
.switch.on span{left:21px}
.toneSetting{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:16px}
.toneSetting span{font-size:14px;font-weight:600}

.scrim{display:none}

/* ============ RESPONSIVE ============ */
@media (max-width:1100px){
  .metrics,.metrics.four{grid-template-columns:repeat(2,1fr)}
  .two-one{grid-template-columns:1fr}
  .board{grid-template-columns:repeat(2,1fr)}
  .channelGrid{grid-template-columns:repeat(2,1fr)}
  .insightRail{grid-template-columns:repeat(2,1fr)}
  .leadsTop{grid-template-columns:1fr}
}
@media (max-width:900px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
  .sidebar.open{transform:translateX(0);box-shadow:20px 0 50px rgba(0,0,0,.25)}
  .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:55;backdrop-filter:blur(2px)}
  .hamburger{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--ink2)}
  .hamburger:hover{background:var(--surface)}
  .topSearch{display:none}
  .onlyMobile{display:grid}
  .topTitle{flex:1}
  /* inbox: one pane at a time */
  .inboxPage{padding:16px}
  .inboxTop{grid-template-columns:1fr}
  .commsMetrics{grid-template-columns:repeat(2,1fr)}
  .inbox{min-height:78vh}
  .inboxGrid{grid-template-columns:1fr}
  .inboxResizer{display:none}
  .inboxToolbar .filterChips{flex:1 1 100%}
  .inboxSearch{width:100%}
  .inboxGrid .thread{display:none}
  .inboxGrid.showThread .inboxList{display:none}
  .inboxGrid.showThread .thread{display:grid}
  .backBtn{display:grid}
  .panelToggle{display:grid}
  .ctxPanel{width:min(320px,88vw)}
}
@media (max-width:600px){
  .metrics,.metrics.four{grid-template-columns:1fr}
  .board{grid-template-columns:1fr}
  .channelGrid{grid-template-columns:1fr}
  .insightRail{grid-template-columns:1fr}
  .funnelNums{gap:8px}
  .funnelConv{display:none}
  .inboxChannelCard .chList{grid-template-columns:1fr}
  .page{padding:20px 16px 60px}
  .pageHead h1{font-size:22px}
  .topbar{padding:0 14px}
  .content .page .pageHeadActions{width:100%}
  .msg{max-width:86%}
  .dataTable{display:block;overflow-x:auto;white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){
  .app *{transition:none!important;animation:none!important}
}
`;
